services:

  api:
    build: ./app
    ports:
      - "8000:8000"

    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
             
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: localpassword

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: