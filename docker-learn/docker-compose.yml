services:

  app1:
    build:
      context: ./app1
    container_name: app1
    ports:
      - "8001:8000"

  app2:
    build:
      context: ./app2
    container_name: app2
    ports:
      - "8002:8000"

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis


volumes:
  postgres-data: